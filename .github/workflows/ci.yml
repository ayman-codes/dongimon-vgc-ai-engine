name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nodejs npm

      - name: Set up Pokemon Showdown
        run: |
          git clone --depth=1 https://github.com/smogon/pokemon-showdown.git /tmp/pokemon-showdown
          cd /tmp/pokemon-showdown
          npm install
          node pokemon-showdown start --no-security &
          sleep 3

      - name: Install vgc2
        run: |
          git clone --depth=1 https://gitlab.com/DracoStriker/pokemon-vgc-engine.git /tmp/vgc2
          uv pip install -e /tmp/vgc2

      - name: Install dongimon
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ scripts/

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Test with pytest
        run: uv run pytest tests/ -v --timeout=30
