[project]
name = "dongimon"
version = "2.0.0"
description = "Reinforcement Learning & Game Theory engine for competitive Pokémon VGC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "mlflow>=2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "gymnasium>=1.0",
    "numpy>=2.2",
    "optuna>=3.6",
    "scipy>=1.12",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
    "C4",               # flake8-comprehensions
    "SIM",              # flake8-simplify
    "I",                # isort
    "T20",              # flake8-print
]
ignore = [
    "T201",  
    "N802",   
    "N803",
    "N806",
    "S101",  
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests/", "legacy/"]
packages = ["src"]

[[tool.mypy.overrides]]
module = "vgc2.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "legacy.*"
ignore_errors = true



[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
